# The design-token gates in CI: the same `beforeCommit` commands a person's
# and an agent's commit run (design-system/gates.json). Copy to
# .github/workflows/design-tokens.yml, then set the Node version and the
# install command to the project's own.
name: design-tokens

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node .claude/hooks/design-tokens/run-gates.mjs before-commit
